<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kalkulator Modern & Interaktif</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #0f172a, #1e293b);
            color: #ffffff;
            overflow: hidden;
        }

        .calculator-container {
            position: relative;
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            padding: 30px;
            border-radius: 30px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.4),
                        inset 0 1px 0 rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.05);
            width: 380px;
            transition: transform 0.3s ease;
        }

        .calculator-container:hover {
            transform: translateY(-5px);
        }

        .display {
            width: 100%;
            height: 120px;
            background: rgba(15, 23, 42, 0.6);
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            padding: 20px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: flex-end;
            margin-bottom: 25px;
            overflow: hidden;
        }

        .history {
            font-size: 0.95rem;
            color: #94a3b8;
            min-height: 24px;
            word-wrap: break-word;
            word-break: break-all;
            max-width: 100%;
            text-align: right;
            transition: all 0.2s;
        }

        .current-input {
            font-size: 2.2rem;
            font-weight: 500;
            color: #fff;
            max-width: 100%;
            overflow-x: auto;
            white-space: nowrap;
            scrollbar-width: none;
        }

        .current-input::-webkit-scrollbar {
            display: none;
        }

        .buttons-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 14px;
        }

        button {
            border: none;
            outline: none;
            height: 65px;
            border-radius: 18px;
            font-size: 1.35rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.15s cubic-bezier(0.4, 0, 0.2, 1);
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            overflow: hidden;
        }

        button:active {
            transform: scale(0.92);
        }

        /* Glassmorphism Button Styles */
        .btn-number {
            background: rgba(255, 255, 255, 0.06);
            color: #f8fafc;
            border: 1px solid rgba(255, 255, 255, 0.03);
        }

        .btn-number:hover {
            background: rgba(255, 255, 255, 0.12);
        }

        .btn-operator {
            background: rgba(56, 189, 248, 0.15);
            color: #38bdf8;
            font-size: 1.5rem;
        }

        .btn-operator:hover {
            background: rgba(56, 189, 248, 0.25);
        }

        .btn-function {
            background: rgba(241, 245, 249, 0.1);
            color: #cbd5e1;
        }

        .btn-function:hover {
            background: rgba(241, 245, 249, 0.18);
        }

        .btn-equals {
            background: linear-gradient(135deg, #38bdf8, #0284c7);
            color: #fff;
            grid-column: span 1;
            box-shadow: 0 8px 20px rgba(56, 189, 248, 0.3);
        }

        .btn-equals:hover {
            background: linear-gradient(135deg, #0ea5e9, #0369a1);
            box-shadow: 0 8px 25px rgba(56, 189, 248, 0.4);
        }
        
        .btn-clear {
            color: #f87171;
            background: rgba(248, 113, 113, 0.1);
        }
        
        .btn-clear:hover {
            background: rgba(248, 113, 113, 0.2);
        }

        /* Decorative Background Orbs */
        .bg-orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(80px);
            z-index: -1;
            opacity: 0.5;
        }

        .orb-1 {
            top: -10%;
            left: -10%;
            width: 300px;
            height: 300px;
            background: #38bdf8;
        }

        .orb-2 {
            bottom: -10%;
            right: -10%;
            width: 350px;
            height: 350px;
            background: #6366f1;
        }
    </style>
</head>
<body>

    <div class="bg-orb orb-1"></div>
    <div class="bg-orb orb-2"></div>

    <div class="calculator-container">
        <div class="display">
            <div class="history" id="history"></div>
            <div class="current-input" id="current-input">0</div>
        </div>
        
        <div class="buttons-grid">
            <!-- Row 1 -->
            <button class="btn-function btn-clear" onclick="clearAll()">AC</button>
            <button class="btn-function" onclick="deleteLast()">DEL</button>
            <button class="btn-function" onclick="appendOperator('%')">%</button>
            <button class="btn-operator" onclick="appendOperator('/')">÷</button>
            
            <!-- Row 2 -->
            <button class="btn-number" onclick="appendNumber('7')">7</button>
            <button class="btn-number" onclick="appendNumber('8')">8</button>
            <button class="btn-number" onclick="appendNumber('9')">9</button>
            <button class="btn-operator" onclick="appendOperator('*')">×</button>
            
            <!-- Row 3 -->
            <button class="btn-number" onclick="appendNumber('4')">4</button>
            <button class="btn-number" onclick="appendNumber('5')">5</button>
            <button class="btn-number" onclick="appendNumber('6')">6</button>
            <button class="btn-operator" onclick="appendOperator('-')">−</button>
            
            <!-- Row 4 -->
            <button class="btn-number" onclick="appendNumber('1')">1</button>
            <button class="btn-number" onclick="appendNumber('2')">2</button>
            <button class="btn-number" onclick="appendNumber('3')">3</button>
            <button class="btn-operator" onclick="appendOperator('+')">+</button>
            
            <!-- Row 5 -->
            <button class="btn-number" onclick="toggleSign()">±</button>
            <button class="btn-number" onclick="appendNumber('0')">0</button>
            <button class="btn-number" onclick="appendDecimal('.')">.</button>
            <button class="btn-equals" onclick="calculate()">=</button>
        </div>
    </div>

    <script>
        const currentInputEl = document.getElementById('current-input');
        const historyEl = document.getElementById('history');
        
        let currentInput = '0';
        let previousInput = '';
        let operator = null;
        let shouldResetDisplay = false;

        function updateDisplay() {
            currentInputEl.innerText = formatNumber(currentInput);
            if (operator && previousInput) {
                let displayOp = operator;
                if(operator === '*') displayOp = '×';
                if(operator === '/') displayOp = '÷';
                historyEl.innerText = `${formatNumber(previousInput)} ${displayOp}`;
            } else {
                historyEl.innerText = '';
            }
        }

        function formatNumber(numStr) {
            if (numStr === 'Error' || numStr === 'Infinity') return numStr;
            const [integerPart, decimalPart] = numStr.split('.');
            const formattedInteger = Number(integerPart).toLocaleString('id-ID');
            return decimalPart !== undefined ? `${formattedInteger},${decimalPart}` : formattedInteger;
        }

        function appendNumber(number) {
            if (currentInput === '0' || shouldResetDisplay) {
                currentInput = number;
                shouldResetDisplay = false;
            } else {
                if (currentInput.replace(/[.,]/g, '').length >= 12) return; // Limit digit
                currentInput += number;
            }
            updateDisplay();
        }

        function appendDecimal(dot) {
            if (shouldResetDisplay) {
                currentInput = '0';
                shouldResetDisplay = false;
            }
            if (!currentInput.includes('.')) {
                currentInput += '.';
            }
            updateDisplay();
        }

        function appendOperator(op) {
            if (operator && !shouldResetDisplay) {
                calculate();
            }
            previousInput = currentInput;
            operator = op;
            shouldResetDisplay = true;
            updateDisplay();
        }

        function calculate() {
            if (!operator || shouldResetDisplay) return;

            let result;
            const prev = parseFloat(previousInput);
            const current = parseFloat(currentInput);

            if (isNaN(prev) || isNaN(current)) return;

            switch (operator) {
                case '+': result = prev + current; break;
                case '-': result = prev - current; break;
                case '*': result = prev * current; break;
                case '/': 
                    result = current === 0 ? 'Error' : prev / current; 
                    break;
                case '%': result = (prev * current) / 100; break;
                default: return;
            }

            // Batasi presisi desimal agar tidak terlalu panjang
            if (typeof result === 'number') {
                result = parseFloat(result.toFixed(8)).toString();
            }

            currentInput = result;
            operator = null;
            previousInput = '';
            shouldResetDisplay = true;
            updateDisplay();
        }

        function clearAll() {
            currentInput = '0';
            previousInput = '';
            operator = null;
            shouldResetDisplay = false;
            updateDisplay();
        }

        function deleteLast() {
            if (shouldResetDisplay || currentInput === 'Error') {
                clearAll();
                return;
            }
            if (currentInput.length > 1) {
                currentInput = currentInput.slice(0, -1);
                if (currentInput === '-' || currentInput === '') currentInput = '0';
            } else {
                currentInput = '0';
            }
            updateDisplay();
        }

        function toggleSign() {
            if (currentInput === '0' || currentInput === 'Error') return;
            currentInput = (parseFloat(currentInput) * -1).toString();
            updateDisplay();
        }

        // Dukungan Keyboard
        document.addEventListener('keydown', (e) => {
            if (e.key >= '0' && e.key <= '9') appendNumber(e.key);
            if (e.key === '.' || e.key === ',') appendDecimal('.');
            if (e.key === '+') appendOperator('+');
            if (e.key === '-') appendOperator('-');
            if (e.key === '*') appendOperator('*');
            if (e.key === '/') appendOperator('/');
            if (e.key === '%') appendOperator('%');
            if (e.key === 'Enter' || e.key === '=') { e.preventDefault(); calculate(); }
            if (e.key === 'Backspace') deleteLast();
            if (e.key === 'Escape') clearAll();
        });
    </script>
</body>
</html>
